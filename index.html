<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>360 Virtual Tour Viewer</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div id="panorama"></div>

    <!-- Media Pop-up Modal Window Panel Interface -->
      <!-- Media Pop-up Modal Window Panel Interface -->
    <div class="modal-overlay" id="mediaModal">
        <div class="modal-content">
            <button class="close-btn" id="closeModal">&times;</button>
            
            <!-- Dynamic Modal Heading Title -->
            <h2 class="modal-title">TV Center Display</h2>
            
            <!-- Beautiful Dynamic Placeholder Image -->
            <img src="https://picsum.photos" alt="Feature Graphic" style="width:100%; border-radius:8px; margin-bottom:15px; display:block;">
            
            <p class="modal-subtext">This is a custom subtext area describing the television interface module. Below is a sample audio track acting as a dummy MP3 placeholder.</p>
            
            <!-- ADD THIS: Custom Text Area Form Element Field -->
            <textarea placeholder="Type your custom notes or descriptions here..." style="width: 100%; height: 75px; padding: 10px; border-radius: 6px; border: 1px solid #ccc; margin-bottom: 15px; font-family: inherit; resize: none; box-sizing: border-box;"></textarea>

            <!-- Dummy MP3 Audio Player Element -->
            <audio controls id="modalAudio">
                <source src="https://codesandbox.io" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>
    </div>

    <script src="./pannellum.js"></script>
    <script src="./app.js"></script>
</body>
</html>
