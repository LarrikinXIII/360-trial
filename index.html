<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Virtual Tour Viewer</title>
    
    <link rel="stylesheet" href="./pannellum.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div id="panorama"></div>

    <!-- Media Pop-up Modal -->
    <div class="modal-overlay" id="mediaModal">
        <div class="modal-content">
            <button class="close-btn" id="closeModal">&times;</button>
            <h2 class="modal-title">TV Center Display</h2>
            
            <!-- Beautiful Dynamic Picsum Placeholder Image -->
            <img src="https://picsum.photos/400/400?random=3" alt="Modal Feature" style="width:100%; border-radius:8px; margin-bottom:15px; display:block;">
            
            <p class="modal-subtext">This is a custom subtext area describing the television interface module. Below is a sample audio track acting as a dummy MP3 placeholder.</p>
            
            <!-- Dummy MP3 Audio Player -->
            <audio controls id="modalAudio">
                <source src="https://codesandbox.io" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>
    </div>

    <script src="./pannellum.js"></script>
    <script src="./app.js"></script>
</body>
</html>
