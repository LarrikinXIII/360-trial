<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>360 Virtual Tour Viewer</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- 360 Panorama Viewer Element Layout Window Wrapper -->
    <div id="panorama"></div>

    <div id="hud">
    <div id="scene-title">🛋️ Luxury Living Room</div>
    <div id="hint">Drag to look · Scroll to zoom · Click thumbnails to switch scene</div>
</div>
<div id="scene-switcher">
    <a class="scene-thumb order-btn" id="order-thumb" href="../contact/index.html">ORDER YOURS</a>
</div>
<div id="controls">
    <button class="ctrl-btn" id="autoplay-btn" onclick="toggleAutoplay()">⏸ Stop Auto Rotate</button>
    <button class="ctrl-btn" id="gyro-btn" title="Toggle Gyro">Gyro Off</button>
    <button class="ctrl-btn" id="globalAudioToggle" title="Toggle Background Music">🔊 Music On</button>
    <button class="ctrl-btn" onclick="resetView()">⌂ Reset</button>
    <button class="ctrl-btn fullscreen-toggle" id="fullscreen-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
</div>
<div id="fov-slider">
    <label>ZOOM</label>
    <input type="range" id="fov" min="30" max="120" value="75" oninput="setFov(this.value)">
    <label id="fov-val">75°</label>
</div>
    
    <!-- Unified Media Pop-up Modal Window Panel Interface -->
    <div class="modal-overlay" id="mediaModal">
        <div class="modal-content">
            <!-- Close Button Element -->
            <button class="close-btn" id="closeModal">&times;</button>
            
            <!-- Dynamic Heading Title -->
            <h2 class="modal-title" id="modalTitle">TV Center Display</h2>
            
            <!-- Dynamic Context Feature Image -->
            <img src="" alt="Feature Art Frame Graphic" id="modalImage" style="width:100%; border-radius:8px; margin-bottom:15px; display:none;">
            
            <!-- Dynamic Subtext Descriptive Paragraph -->
            <p class="modal-subtext" id="modalSubtext">This is a custom subtext area.</p>
    
            <!-- Dynamic MP3 Audio Player Node -->
            <audio controls id="modalAudio">
                <source id="audioSource" src="" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>
    </div>

    <!-- Background Music Audio Engine (Muted + Looping for Security Permissions) -->
    <audio id="globalAmbientAudio" loop muted>
        <source src="alex-productions-sexy-sax.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Custom Exterior JavaScript Architecture Links -->
    <script src="./pannellum.js"></script>
    <script src="./app.js"></script>
</body>
</html>
